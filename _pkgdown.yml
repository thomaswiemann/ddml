url: https://www.thomaswiemann.com/ddml

template:
  bootstrap: 5

# Exclude AI-tooling artifacts from the site
exclude:
  - GEMINI.md
  - .cursor
  - .discussion
  - .discussions

home:
  title: Double/Debiased Machine Learning in R
  description: Estimate common causal parameters using double/debiased machine
    learning. 'ddml' simplifies estimation based on (short-)stacking, which
    leverages multiple base learners to increase robustness to the underlying
    data generating process.
  sidebar:
    structure:
    - links
    - license
    - citation
    - authors
    - dev

navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - tutorials
    - news
    right:
    - search
    - github

reference:
- title: internal
  contents:
  - ddml-package
  - matches("print")
  - matches("summary")
  - matches("sub-")
- title: Supported DDML Estimators
  contents:
  - ddml_plm
  - ddml_pliv
  - ddml_fpliv
  - ddml_ate
  - ddml_att
  - ddml_late
  - ddml_apo
- title: Repeated Resampling
  contents:
  - ddml_replicate
- title: internal
  contents:
  - ddml-intro
  - ddml
  - ddml_rep
  - coef.ddml
  - confint.ddml
  - vcov.ddml
  - hatvalues.ddml
  - nobs.ddml
  - tidy.ddml
  - glance.ddml
  - tidy.ddml_diagnostics
  - ensemble_weights
  - coef.ddml_rep
  - confint.ddml_rep
  - vcov.ddml_rep
  - tidy.ddml_rep
  - glance.ddml_rep
  - nobs.ddml_rep
  - length.ddml_rep
  - "`[[.ddml_rep`"
  - reexports
  - matches("predict")
- title: Wrappers for Common (Machine) Learners
  contents:
  - ols
  - mdl_glm
  - mdl_glmnet
  - mdl_ranger
  - mdl_xgboost
  - mdl_bigGLM
- title: Utilities
  contents:
  - crossval
  - crosspred
  - shortstacking
  - ensemble
  - diagnostics
- title: Dataset
  contents:
  - AE98

articles:
- title: Key Features
  navbar: ~
  contents:
  - ddml
  - articles/stacking
  - articles/stacking_diagnostics
  - articles/repeated_resampling
  - articles/modelsummary_integration
  - articles/new_ml_wrapper
  - articles/sparse
  - articles/did
- title: Case Studies
  contents:
  - starts_with("articles/example")

